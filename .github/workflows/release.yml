name: Release

# Tag and push, and that is the whole publishing step:
#
#   ./Scripts/bundle.sh   (locally, to check it)
#   git tag v1.0.1 && git push origin v1.0.1
#
# Blinky's own update check reads GitHub's latest release, so what this
# publishes is exactly what installed copies are offered.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write
  # Listing Build runs needs this. contents: write is what Publish and the
  # feed push already use; setting any permission drops the rest.
  actions: read

# One Release at a time. A second run waits; it is not cancelled mid-upload.
#
# Two pushes of the same tag (a lightweight tag, then the annotated one) used
# to overlap. The first signed its zip into appcast.xml. The second replaced
# that zip with `gh release upload --clobber` and the feed writer then left
# the existing item alone, so Sparkle verified the new archive with the old
# signature. Waiting lets the second run finish and re-sign the zip it
# actually published. Cancelling the in-progress run would drop a release
# halfway through Publish.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # The version lives in VERSION and the tag has to agree with it: the
      # update check compares the published tag against the bundle's
      # CFBundleShortVersionString, which is read from that file. Mismatched,
      # every installed copy would be told forever that an update is waiting.
      - name: Tag and VERSION must agree
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG  VERSION=$FILE"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag v$TAG does not match VERSION ($FILE). Bump VERSION, commit, then re-tag."
            exit 1
          fi
          echo "VERSION=$FILE" >> "$GITHUB_ENV"

      # Before anything is built or published, so a missing entry costs a
      # re-tag rather than a release whose notes went out wrong. English
      # CHANGELOG.md reaches Sparkle; both EN+ZH feed the GitHub Release body.
      - name: The changelog has an entry for this version
        run: |
          if ! Scripts/changelog.py "$VERSION" > /dev/null 2>&1; then
            echo "::error::CHANGELOG.md has no '## $VERSION' entry. Write it, commit, then re-tag."
            exit 1
          fi
          if ! grep -qE "^## ${VERSION}[[:space:]]*$" CHANGELOG.zh-CN.md; then
            echo "::error::CHANGELOG.zh-CN.md has no '## $VERSION' entry. Write the Chinese notes, commit, then re-tag."
            exit 1
          fi

      - name: Check the SDK is new enough
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)"
          if [ "$SDK" -lt 26 ]; then
            echo "::error::macOS SDK $SDK is too old — PanelSurface needs 26 for glassEffect."
            exit 1
          fi

      - name: Localization keys
        run: ./Scripts/check-localization.sh

      # ci.yml (the workflow named Build) already compiles and tests this
      # commit on push and on pull request. Skip the debug build and
      # swift test here when that run has finished green. No run, a
      # failure, a cancellation, or a run that has not finished yet all
      # leave both steps in place. A tag pushed as the commit lands
      # usually finds Build still going, and these tests are what stands
      # between that and a Sparkle update.
      - name: Prior CI for this commit
        id: prior_ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "commit=$SHA"
          # The file name, so a renamed workflow title still means this check.
          line="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$SHA" \
            --status success \
            --limit 1 \
            --json headSha,conclusion,event,url \
            --jq '.[0] // empty | if . == null or . == "" then "" else "\(.headSha)\t\(.conclusion)\t\(.event)\t\(.url)" end')"
          case "$line" in
            "$SHA"$'\t'"success"$'\t'*)
              echo "green=true" >> "$GITHUB_OUTPUT"
              echo "Build already succeeded for $SHA (${line##*$'\t'}). Skipping the debug build and tests."
              ;;
            "")
              echo "green=false" >> "$GITHUB_OUTPUT"
              echo "No successful Build workflow for $SHA. The debug build and tests will run."
              ;;
            *)
              echo "::error::Unexpected Build lookup result: $line"
              exit 1
              ;;
          esac

      - name: Build
        if: steps.prior_ci.outputs.green != 'true'
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "::error::The build produced warnings, which this project treats as failures."
            grep "warning:" build.log | head -40
            exit 1
          fi

      # Runs together with the debug build above: both stay when this
      # commit has no finished green Build yet.
      - name: Tests
        if: steps.prior_ci.outputs.green != 'true'
        run: swift test

      # The disk image carries the install instructions on its window, so it is
      # the download people should get; the zip is there for anything that
      # would rather have an archive.
      #
      # One universal release build. bundle.sh writes the app and the zip;
      # dmg.sh --reuse packs that same app. This step used to run dmg.sh
      # (which builds) and then bundle.sh --zip, so
      # `swift build -c release --arch arm64 --arch x86_64` ran twice.
      - name: Package
        run: |
          ./Scripts/bundle.sh --zip
          ./Scripts/dmg.sh --reuse
          ls -lh build.noindex/

      - name: Release notes
        run: |
          # Bilingual GitHub Release body (Chinese first). Sparkle still reads
          # CHANGELOG.zh-CN.md (preferred) / CHANGELOG.md via appcast.py — these
          # pages are separate on purpose. Presence of both entries was checked
          # before the build.
          Scripts/release-notes.py "$VERSION" > notes.md

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v1.1.0-beta.1 is published as a pre-release, which
          # GitHub's "latest release" excludes — and so, therefore, does
          # Blinky's update check.
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease";; esac

          # Re-runnable. A later step failing used to mean deleting the release
          # and the tag and starting over, which is a lot of ceremony for a
          # typo in the step after this one.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release exists — replacing its assets."
            gh release upload "v$VERSION" \
              "build.noindex/Blinky-$VERSION.dmg" \
              "build.noindex/Blinky-$VERSION.zip" \
              --clobber
          else
            gh release create "v$VERSION" \
              "build.noindex/Blinky-$VERSION.dmg" \
              "build.noindex/Blinky-$VERSION.zip" \
              --title "Blinky $VERSION" \
              --notes-file notes.md \
              $PRERELEASE
          fi

      # After publishing, because the feed points at the release's own asset —
      # committing it first would advertise a download that 404s.
      #
      # This is what makes updates *install themselves*. Sparkle refuses an
      # archive that isn't signed by the private half of the key whose public
      # half is baked into the app, so the signature written here is the whole
      # trust story: it holds even though the app carries only an ad-hoc
      # signature and Apple has vouched for nothing.
      - name: Offer it to Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # **A pre-release is not offered to Sparkle.** Publishing it with
          # --prerelease kept it off GitHub's "latest", but the feed has no
          # beta channel, so an item here reached every installed copy as an
          # ordinary update.
          case "$VERSION" in *-*)
            echo "Pre-release $VERSION — the feed is left as it is."
            exit 0;;
          esac

          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set — installed copies would never see this release."
            exit 1
          fi

          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/Blinky-$VERSION.zip"

          # The tag was checked out detached; the feed lives on main.
          git fetch origin main
          git checkout -B main origin/main

          # When this version is already in the feed, appcast.py rewrites that
          # item's enclosure from the zip this run just published (Publish
          # uses --clobber). The feed keeps that one newest item. A second
          # run for the same tag therefore commits a signature for the asset
          # that is actually on the release.
          Scripts/appcast.py "$VERSION" "build.noindex/Blinky-$VERSION.zip" "$URL"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The main feed and its one-language copies (appcast-zh.xml,
          # appcast-en.xml), which Blinky reads when it is set to a language.
          git add appcast.xml appcast-zh.xml appcast-en.xml

          # Staged first, and compared against the index rather than the
          # working tree: `git diff` only looks at *tracked* files, so on the
          # very first release — when the feed is brand new — it reported no
          # change, the step exited green, and nothing was ever committed. A
          # step that succeeds without doing its job is the worst kind.
          if git diff --cached --quiet -- appcast.xml appcast-zh.xml appcast-en.xml; then
            echo "Feed already offers $VERSION."
          else
            git commit -m "Offer $VERSION to Sparkle"
            # main can advance while this job packages — another pull request
            # merging between the fetch above and this push. Rebase onto the
            # main we are about to update, and try a few times when the push
            # is rejected. A conflict stops the step. The feed is not force-pushed.
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Could not rebase the Sparkle feed onto origin/main."
                git rebase --abort || true
                exit 1
              fi
              if git push origin main; then
                pushed=1
                break
              fi
              echo "Push to main was rejected (attempt ${attempt} of 5)."
              if [ "$attempt" -lt 5 ]; then
                sleep $((attempt * 2))
              fi
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Could not push the Sparkle feed to main."
              exit 1
            fi
          fi

          # Read the feed from origin/main after the push. A commit that
          # exists only on the runner does not offer the update.
          git fetch origin main
          if ! git show origin/main:appcast.xml | grep -q "<sparkle:shortVersionString>$VERSION<"; then
            echo "::error::appcast.xml on main does not offer $VERSION — installed copies would never see it."
            exit 1
          fi
          echo "Feed on main offers $VERSION."
