<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Outlines only, no strokes: Icon Composer takes an open stroked path as
       enclosing the area its chord closes, and shadows that edge — a line
