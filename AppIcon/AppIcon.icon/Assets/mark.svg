         inner corner into a crease. -->
    <path fill="#C8F03C" d="M402 194 H562 A200 200 0 0 1 562 594 H530 A50 50 0 0 1 530 494 H562 A100 100 0 0 0 562 294 H442 A40 40 0 0 0 402 334 Z" />
  </g>
